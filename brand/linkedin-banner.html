<meta charset="utf-8">
<title>Banner do LinkedIn</title>
<!-- Banner do LinkedIn (1584x396) no visual do site alikhodr.dev: painel cobalto, campo de
     pontos, faixas da grade de 132px com marcadores e logos da stack. A foto de perfil cobre o
     canto inferior esquerdo, por isso o texto começa em x=528. Gere o PNG com:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=1584,396 --virtual-time-budget=8000 \
       --screenshot=brand/linkedin-banner.png brand/linkedin-banner.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --cobalt: #2b52f0;
    --cobalt-100: #e3e9ff;
    --cobalt-700: #2141cc;
    --line: rgb(255 255 255 / 0.18);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body {
    position: relative;
    background: var(--cobalt);
    color: #fff;
    font-family: 'Host Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* Luz baixa e sombra no canto, como o painel do topo do site. */
  .light {
    background:
      radial-gradient(55% 70% at 38% 125%, rgb(186 204 255 / 0.5), transparent 70%),
      radial-gradient(60% 90% at 0% 0%, rgb(20 34 140 / 0.45), transparent 60%);
  }

  /* Campo de pontos de 9px. */
  .dots {
    background-image: radial-gradient(circle at center, rgb(255 255 255 / 0.24) 1px, transparent 1.4px);
    background-size: 9px 9px;
    mask-image: radial-gradient(90% 120% at 40% 110%, black 15%, transparent 75%);
  }

  /* Duas faixas horizontais da grade, separando selo, domínio e stack. */
  .rules {
    background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: 100% 132px;
    background-position: 0 132px;
    background-repeat: repeat-y;
    mask-image: linear-gradient(to right, transparent 22%, black 48%);
  }
  .rules::after {
    content: '';
    position: absolute; left: 0; right: 0; top: 264px; height: 1px;
    background: var(--line);
  }

  .cell {
    position: absolute;
    width: 132px; height: 132px;
    display: grid; place-items: center;
    background: rgb(255 255 255 / 0.06);
    color: rgb(255 255 255 / 0.92);
    border-left: 1px solid var(--line);
  }
  .node {
    position: absolute;
    width: 9px; height: 9px;
    margin: -4px 0 0 -4px;
    border: 1px solid rgb(255 255 255 / 0.55);
    background: var(--cobalt);
  }

  .row { position: absolute; left: 528px; height: 132px; display: flex; align-items: center; }
  .badge {
    padding: 7px 18px;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / 0.45);
    font-size: 21px;
  }
  .domain {
    display: flex; align-items: center; gap: 22px;
    padding-top: 6px;
    font-size: 104px; line-height: 1; font-weight: 500; letter-spacing: -0.035em;
  }
  .arrow {
    display: grid; place-items: center;
    width: 66px; height: 66px; border-radius: 999px;
    background: #fff; color: var(--cobalt-700);
    margin-top: 8px;
  }
  .stack { align-items: flex-start; padding-top: 30px; font-size: 25px; color: var(--cobalt-100); }
  .stack span { color: #fff; }
</style>
</head>
